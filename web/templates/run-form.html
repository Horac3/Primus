<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Configure Run — Primus</title>
<script src="/static/htmx.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
  h1   { font-size: 1.4rem; }
  h2   { font-size: 1rem; margin-top: 1.5rem; color: #57606a; }
  label { display: block; margin-bottom: 0.75rem; }
  label span { display: block; font-size: 0.85rem; color: #57606a; margin-bottom: 2px; }
  input[type=number], input[type=text], select {
    border: 1px solid #d1d5db; border-radius:4px; padding: 0.35rem 0.5rem;
    font-size: 0.95rem; width: 100%; max-width: 260px;
  }
  button { background:#3b82d4; color:#fff; border:none; border-radius:4px;
           padding:0.4rem 1.2rem; cursor:pointer; font-size:0.95rem; margin-top:0.5rem; }
  details { margin-top: 0.75rem; }
  summary { cursor: pointer; color: #3b82d4; }
  .hint { font-size: 0.82rem; color: #57606a; margin-top: 0.5rem; }
  a { color: #3b82d4; text-decoration: none; }
  nav { margin-bottom: 1rem; }
</style>
</head>
<body>
<nav><a href="/">← Dashboard</a></nav>
<h1>Configure Run: {{.Request.Name}}</h1>
<p style="color:#57606a"><code>{{.Request.Method}} {{.Request.URLTemplate}}</code></p>
<p class="hint">⚠️ This will block until the run completes. Keep <em>total requests</em> small for quick tests.</p>

<form method="POST" action="/runs">
  <input type="hidden" name="request_id" value="{{.Request.ID}}">

  <h2>Mode</h2>
  <label>
    <span>Mode</span>
    <select name="mode">
      <option value="load">Load (constant concurrency)</option>
      <option value="burst">Burst (pulsed)</option>
    </select>
  </label>

  <h2>Load Parameters</h2>
  <label>
    <span>Concurrency</span>
    <input type="number" name="concurrency" value="5" min="1" max="500">
  </label>
  <label>
    <span>Total Requests</span>
    <input type="number" name="total_requests" value="50" min="1">
  </label>

  <details>
    <summary>Burst settings (only used in Burst mode)</summary>
    <label style="margin-top:0.75rem">
      <span>Requests per burst</span>
      <input type="number" name="burst_count" value="10" min="1">
    </label>
    <label>
      <span>Idle between bursts (ms)</span>
      <input type="number" name="burst_idle_ms" value="500" min="0">
    </label>
  </details>

  <h2>Assertions (optional)</h2>
  <label>
    <span>Expected status codes (comma-separated, e.g. 200,201)</span>
    <input type="text" name="expected_status" placeholder="200">
  </label>
  <label>
    <span>Max P95 latency (ms, 0 = disabled)</span>
    <input type="number" name="max_p95_ms" value="0" min="0">
  </label>
  <label>
    <span>Max error rate (0–1, e.g. 0.05 = 5%, 0 = disabled)</span>
    <input type="number" name="max_error_rate" value="0" min="0" max="1" step="0.01">
  </label>

  <button type="submit">▶ Run Test</button>
</form>
</body>
</html>
