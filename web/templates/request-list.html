{{define "request-list"}}
<h2>Request Definitions ({{len .Requests}})</h2>
{{if .Requests}}
<table>
  <thead><tr><th>Name</th><th>Method</th><th>URL Template</th><th></th></tr></thead>
  <tbody>
  {{range .Requests}}
  <tr>
    <td>{{.Name}}</td>
    <td><code>{{.Method}}</code></td>
    <td><code>{{.URLTemplate}}</code></td>
    <td><a href="/requests/{{.ID}}/run">Configure Run →</a></td>
  </tr>
  {{end}}
  </tbody>
</table>
{{else}}
<p style="color:#57606a">No request definitions yet. Import a spec above.</p>
{{end}}
{{end}}
